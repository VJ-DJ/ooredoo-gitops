apiVersion: apps/v1
kind: Deployment
metadata:
  name: ooredoo-sample-app
  namespace: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ooredoo-sample-app
  template:
    metadata:
      labels:
        app: ooredoo-sample-app
    spec:
      containers:
        - name: sample-app
          image: ghcr.io/vj-dj/ooredoo-sample-app:fb6dae85e0fe5ba8e168ea42015adf69f586ca8d
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: ooredoo-pg-2l2ki.postgres.database.azure.com
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: postgres
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
