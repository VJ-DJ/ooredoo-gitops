apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ooredoo-sample-app
  namespace: sample-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: app.20.105.77.90.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ooredoo-sample-app
                port:
                  number: 80
