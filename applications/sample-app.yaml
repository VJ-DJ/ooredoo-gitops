
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ooredoo-sample-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VJ-DJ/ooredoo-gitops.git
    targetRevision: main
    path: sample-app/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
